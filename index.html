<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b5443">
<title>半吊子 訂單系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f1ea; --card:#fff; --ink:#3d3229; --muted:#8a7d70; --line:#e6ddd2;
  --brown:#6b5443; --brown-2:#8c705b; --soft:#efe7dc;
  --reg-bg:#e6f2e4; --reg-bd:#5f9b62;
  --cus-bg:#efe6f7; --cus-bd:#8a6bb8;
  --pr-bg:#fce8d4;  --pr-bd:#d98a3d;
  --red:#d14343; --red-bg:#fde8e8; --blue:#3a6ea5; --amber:#b7791f; --amber-bg:#fff4d6;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--brown);color:#fff;padding:10px 16px calc(10px);display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;letter-spacing:.05em}
header.top .me{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
.demo-flag{background:#f5c542;color:#3d3229;font-size:12px;border-radius:6px;padding:2px 6px}
.range{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:48px;z-index:15}
.range .row{display:flex;align-items:center;gap:6px}
.range input[type=date]{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
main{padding:12px 16px}
.sum{color:var(--muted);font-size:14px;margin:4px 0 12px}
.sum b{color:var(--ink)}
h2.sec{font-size:15px;color:var(--brown);margin:18px 0 8px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .u{font-size:14px;color:var(--muted);margin-left:2px;font-weight:400}
.kpi .name{font-size:15px;margin-bottom:4px}
.kpi .sub{font-size:13px;color:var(--amber);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.pk-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pk-head b{font-size:17px}
.pk-head span{color:var(--muted);font-size:14px}
.pk-row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--line);font-size:16px}
.pk-row .c{font-weight:700;font-variant-numeric:tabular-nums}
.totals{display:flex;flex-wrap:wrap;gap:6px}
.totals span{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:14px}
.totals b{font-variant-numeric:tabular-nums}
/* order cards */
.oc{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid;border-left-width:6px}
.t-regular{background:var(--reg-bg);border-color:var(--reg-bd)}
.t-custom{background:var(--cus-bg);border-color:var(--cus-bd)}
.t-pr{background:var(--pr-bg);border-color:var(--pr-bd)}
.oc.st-done,.oc.st-cancel{background:#f1efec;border-color:#c9c2b9;color:#7d746b}
.oc .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc .nm{font-size:18px;font-weight:700}
.oc .ph{color:var(--blue);text-decoration:none;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.b{font-size:12.5px;border-radius:6px;padding:2px 7px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);white-space:nowrap}
.b.red{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.b.ok{background:#fff;color:#2f6b33;border-color:#a9cfa9}
.b.amber{background:var(--amber-bg);color:var(--amber);border-color:#ecd28c;font-weight:700}
.b.type{background:rgba(0,0,0,.06);border:0}
.b.st{background:var(--ink);color:#fff;border:0}
.items{margin:8px 0 0;padding:8px 10px;background:rgba(255,255,255,.7);border-radius:8px;font-size:15px}
.items .bx{font-weight:700}
.items .sub{color:var(--muted);font-size:13.5px;padding-left:12px}
.need{margin-top:6px;font-size:14.5px;background:rgba(255,255,255,.7);border-radius:8px;padding:6px 10px}
.need b{color:var(--brown)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:15px}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.danger{color:var(--red);border-color:#f0c4c4}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14.5px}
.alert.amber{background:var(--amber-bg);border:1px solid #ecd28c}
.alert.red{background:var(--red-bg);border:1px solid #f0c4c4}
.alert b{display:block;margin-bottom:4px}
.alert ul{margin:0;padding-left:18px}
.dayh{font-weight:700;color:var(--brown);margin:16px 0 8px;display:flex;justify-content:space-between}
.dayh span{font-weight:400;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:760px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--brown);font-weight:700}
/* modal */

#modal.show{display:block}
#modal .sheet{position:absolute;inset:0;margin:0 auto;max-width:760px;background:var(--bg);display:flex;flex-direction:column}
@media(min-width:780px){#modal .sheet{inset:24px auto;left:0;right:0;border-radius:14px;overflow:hidden}}
#modal .mh{background:var(--brown);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
#modal .mh h3{margin:0;font-size:17px;flex:1}
#modal .mh button{background:none;border:0;color:#fff;font-size:22px;line-height:1}
#modal .mb{flex:1;overflow:auto;padding:14px 16px 24px}
#modal .mf{background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
#modal .mf .btn{flex:1}
.f{margin-bottom:12px}
.f>label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.f input[type=text],.f input[type=tel],.f input[type=number],.f input[type=date],.f input[type=password],.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:15px}
.seg button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.seg button.on.t-regular{background:var(--reg-bd);border-color:var(--reg-bd)}
.seg button.on.t-custom{background:var(--cus-bd);border-color:var(--cus-bd)}
.seg button.on.t-pr{background:var(--pr-bd);border-color:var(--pr-bd)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.box>.bt{font-weight:700;color:var(--brown);margin-bottom:8px;font-size:15px}
.line{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg)}
.line .lr{display:grid;grid-template-columns:1fr 1fr 70px 36px;gap:6px;align-items:center}
.line .lr.bx{grid-template-columns:1fr 70px 36px}
.line select,.line input{width:100%;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px}
.line .x{border:0;background:none;color:var(--red);font-size:20px}
.line .hint{font-size:13px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:6px}
.chk input{width:20px;height:20px}
.err{color:var(--red);font-size:14px;margin:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:400;font-size:13px}
tr.warn td{background:var(--amber-bg)}
tr.skip td{color:#aaa}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .t1{font-size:15px}
.set-row .t2{font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:15px}
.tag button{border:0;background:none;color:var(--muted);font-size:16px}
.inl{display:flex;gap:6px}
.inl input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.login{max-width:360px;margin:12vh auto 0;padding:24px}
.login h1{text-align:center;color:var(--brown);font-size:22px}
.login input{width:100%;padding:12px;font-size:22px;text-align:center;letter-spacing:.4em;border:1px solid var(--line);border-radius:12px;margin:12px 0}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.who button{padding:16px;font-size:20px;border-radius:12px;border:1px solid var(--line);background:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:60;display:none;max-width:90vw}
details summary{cursor:pointer;color:var(--brown);font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb .rm{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:24px;padding:0}
.upl{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brown-2);color:var(--brown);border-radius:9px;padding:8px 14px;font-size:15px;cursor:pointer;background:#fff}
.upl input{display:none}
#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
#viewer.show{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#viewer button{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:22px}
</style>
</head>

<script type="module">
/* ============================================================
   半吊子廚房 訂單系統  v1.0
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCO4o2C3ooVYMnYa9igM-Cs8Jh_Ogxn9Ec",
  authDomain: "half-kitchen-orders.firebaseapp.com",
  projectId: "half-kitchen-orders",
  storageBucket: "half-kitchen-orders.firebasestorage.app",
  messagingSenderId: "24673149454",
  appId: "1:24673149454:web:ad49a1215a97def942d25f"
};
const FB_VER = '10.12.2';
/* POS 系統（另一個 Firebase 專案）— 出貨時把標準罐送到 POS 的待處理清單 */
const POS_CONFIG = {
  apiKey: "AIzaSyA7LvmsWTW8G3sp-KyW3ef9O6dd8HuHId4",
  authDomain: "half-kitchen.firebaseapp.com",
  projectId: "half-kitchen",
  storageBucket: "half-kitchen.firebasestorage.app",
  messagingSenderId: "622049282336",
  appId: "1:622049282336:web:df7be0688e4321de0e6f45"
};
const DEMO = new URLSearchParams(location.search).has('demo');

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const clean = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const WD = '日一二三四五六';
const fmtDate = s => { if(!s) return ''; const d = parseYmd(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const fmtTime = t => { if(!t) return ''; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtPhone = p => { const s = String(p||''); return /^09\d{8}$/.test(s) ? `${s.slice(0,4)}-${s.slice(4,7)}-${s.slice(7)}` : s; };
const digits = s => String(s ?? '').replace(/\D/g, '');
function toast(msg, ms = 2200){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms); }

/* ---------- constants ---------- */
const TYPES = {
  regular: { label: '常態出貨', cls: 't-regular' },
  custom:  { label: '客製禮盒', cls: 't-custom' },
  pr:      { label: '公關品',   cls: 't-pr' }
};
const STATUS = { todo: '待製作', ready: '已備妥', done: '已完成', cancel: '已取消' };
const statusText = o => o.status === 'done' ? (o.method === 'delivery' ? '已出貨' : '已取貨') : STATUS[o.status] || o.status;
const PAY_METHODS = ['現金', 'LINE Pay', '街口', '匯款/轉帳', '官網付款'];

function seedData(){
  const P = (id, name, series, unit, std, order, batch = null) => ({ id, name, series, unit, std, order, batch, active: true });
  const snow = ['招牌鹹蛋','經典原味','包心巧克力','可可2.0','伯爵茶','桂花烏龍茶','酸奶洋蔥','莓果','海鹽焦糖'];
  const products = snow.map((n, i) => P('p' + pad(i+1), n, '雪球', '顆', n === '包心巧克力' ? 18 : 20, i+1));
  products.push(P('p10', '美式軟餅乾', '手工餅乾', '片', 6, 10));
  products.push(P('p11', '蔓越莓燕麥餅乾', '手工餅乾', '片', 8, 11));
  ['檸檬','伯爵','可可','鹹蛋','抹茶紅豆'].forEach((n, i) =>
    products.push(P('p' + (12+i), n + '磅蛋糕', '磅蛋糕', '片', 9, 12+i, { label: '條', size: 9 })));
  const packs = [
    { id: 'k1', name: '標準罐／整條', useStd: true, size: 0, order: 1 },
    { id: 'k2', name: '小罐14顆', useStd: false, size: 14, order: 2 },
    { id: 'k3', name: '小罐12顆', useStd: false, size: 12, order: 3 },
    { id: 'k4', name: '5顆裝', useStd: false, size: 5, order: 4 },
    { id: 'k5', name: '3顆裝', useStd: false, size: 3, order: 5 },
    { id: 'k6', name: '單顆／單片裝', useStd: false, size: 1, order: 6 }
  ];
  const config = { staff: ['KS','YH','YR','CT','YP'], sources: ['官方LINE','電話','官網','臉書','IG','其他'], seededAt: Date.now() };
  return { products, packs, config };
}

/* ============================================================
   Data layer: Firestore (real) / in-memory (demo)
   ============================================================ */
let DB;

async function firebaseDB(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  let db;
  try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch{ db = F.getFirestore(app); }
  let uid = null;
  const snapList = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    async init(){
      uid = await new Promise((res, rej) => {
        const off = A.onAuthStateChanged(auth, u => { if(u){ off(); res(u.uid); } });
        A.signInAnonymously(auth).catch(rej);
      });
    },
    async isMember(){
      try{ const s = await F.getDoc(F.doc(db, 'keys', uid)); return s.exists(); }catch{ return false; }
    },
    async register(code){
      const tryKey = () => F.setDoc(F.doc(db, 'keys', uid), { code, at: Date.now() });
      try{ await tryKey(); return true; }
      catch(e){
        if(code !== '0000') return false;
        try{ await F.setDoc(F.doc(db, 'secret', 'pass'), { code: '0000' }); await tryKey(); return true; }catch{ return false; }
      }
    },
    async setPasscode(code){ await F.setDoc(F.doc(db, 'secret', 'pass'), { code }); },
    watch(col, cb, opts = {}){
      let q = F.collection(db, col);
      if(opts.from) q = F.query(q, F.where('shipDate', '>=', opts.from));
      return F.onSnapshot(q, { includeMetadataChanges: false }, s => cb(snapList(s), s.metadata.fromCache),
        e => { console.error(col, e); toast('讀取失敗：' + (e.code || e.message)); });
    },
    async get(col, id){ const s = await F.getDoc(F.doc(db, col, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    async put(col, id, data){ await F.setDoc(F.doc(db, col, id), clean(data)); },
    async add(col, data){ const r = await F.addDoc(F.collection(db, col), clean(data)); return r.id; },
    async patch(col, id, data){ await F.updateDoc(F.doc(db, col, id), clean(data)); },
    async remove(col, id){ await F.deleteDoc(F.doc(db, col, id)); },
    async whereEq(col, field, val){ const s = await F.getDocs(F.query(F.collection(db, col), F.where(field, '==', val))); return snapList(s); },
    async putMany(items){ // [{col,id,data}]
      for(let i = 0; i < items.length; i += 400){
        const b = F.writeBatch(db);
        items.slice(i, i+400).forEach(x => b.set(F.doc(db, x.col, x.id), clean(x.data)));
        await b.commit();
      }
    }
  };
}

function demoDB(){
  const KEY = 'hk-orders-demo';
  const store = LS.get(KEY, {});
  const subs = [];
  const save = () => LS.set(KEY, store);
  const list = col => Object.entries(store[col] || {}).map(([id, d]) => ({ id, ...d }));
  const emit = col => subs.filter(s => s.col === col).forEach(s => s.cb(list(col).filter(d => !s.from || (d.shipDate || '') >= s.from), false));
  const set = (col, id, data) => { (store[col] ||= {})[id] = clean(data); };
  return {
    async init(){},
    async isMember(){ return LS.get('hk-demo-member', false); },
    async register(code){ const ok = code === (store.secret?.pass?.code || '0000'); if(ok) LS.set('hk-demo-member', true); return ok; },
    async setPasscode(code){ set('secret', 'pass', { code }); save(); },
    watch(col, cb, opts = {}){ const s = { col, cb, from: opts.from }; subs.push(s); setTimeout(() => s.cb(list(col).filter(d => !s.from || (d.shipDate || '') >= s.from), false)); return () => subs.splice(subs.indexOf(s), 1); },
    async get(col, id){ const d = store[col]?.[id]; return d ? { id, ...d } : null; },
    async put(col, id, data){ set(col, id, data); save(); emit(col); },
    async add(col, data){ const id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); set(col, id, data); save(); emit(col); return id; },
    async patch(col, id, data){ store[col][id] = { ...store[col][id], ...clean(data) }; save(); emit(col); },
    async remove(col, id){ delete store[col]?.[id]; save(); emit(col); },
    async whereEq(col, field, val){ return list(col).filter(d => d[field] === val); },
    async putMany(items){ const cols = new Set(); items.forEach(x => { set(x.col, x.id, x.data); cols.add(x.col); }); save(); cols.forEach(emit); }
  };
}

function indexAll(){

  S.km = Object.fromEntries(S.packs.map(k => [k.id, k]));
  S.bm = Object.fromEntries(S.boxes.map(b => [b.id, b]));

/* ============================================================
   Core logic (pure)
   ============================================================ */
const packSizeFor = (product, pack) => pack?.useStd ? (Number(product?.std) || 1) : (Number(pack?.size) || 1);
const packLabel = (packName, size, unit) => `${packName}（${size}${unit || ''}）`;

function snapItem(productId, packId, qty){
  const p = S.pm[productId], k = S.km[packId];
  return { productId, productName: p?.name || '（已刪除品項）', unit: p?.unit || '顆',
           packId, packName: k?.name || '（已刪除包裝）', packSize: packSizeFor(p, k), qty: Number(qty) || 0 };
}
function snapBox(boxId){
  const b = S.bm[boxId];
  return (b?.items || []).map(it => snapItem(it.productId, it.packId, it.qty));
}
/* order -> flat list of {productId, packId, packSize, count(packs), units} */
function expand(o){
  const out = [];
  for(const l of o.lines || []){
    if(l.kind === 'box') for(const it of l.items || []) out.push({ ...it, count: (Number(it.qty) || 0) * (Number(l.qty) || 0) });
    else out.push({ ...l, count: Number(l.qty) || 0 });
  }
  return out.map(x => ({ ...x, units: x.count * (Number(x.packSize) || 1) }));
}
function aggregate(orders){
  const map = new Map();
  for(const o of orders) for(const x of expand(o)){
    if(!x.count) continue;
    let r = map.get(x.productId);
    if(!r){
      const p = S.pm[x.productId];
      r = { id: x.productId, name: p?.name || x.productName, unit: p?.unit || x.unit || '顆', series: p?.series || '其他',
            batch: p?.batch || null, order: p?.order ?? 999, units: 0, packs: new Map() };
      map.set(x.productId, r);
    }
    r.units += x.units;
    const key = x.packId + '|' + x.packSize;
    const k = r.packs.get(key) || { name: S.km[x.packId]?.name || x.packName, size: x.packSize, order: S.km[x.packId]?.order ?? 99, count: 0 };
    k.count += x.count; r.packs.set(key, k);
  }
  return [...map.values()].sort((a, b) => a.order - b.order);
}
const inRange = o => o.shipDate >= S.range.from && o.shipDate <= S.range.to;
const rangeOrders = () => S.orders.filter(inRange);
const todoOrders = () => rangeOrders().filter(o => o.status === 'todo');

/* ---------- 官網 Excel parsing ---------- */
const stripPrefix = name => String(name || '').replace(/^\s*[\(（][^\)）]*[\)）]\s*/, '').trim();
function guessShipDate(productName, orderTime){
  const m = String(productName || '').match(/[\(（]\s*(\d{1,2})\s*[\/\.月]\s*(\d{1,2})/);
  if(!m) return '';
  const mo = +m[1], d = +m[2];
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  const t = String(orderTime || '').match(/(\d{4})[\/\-](\d{1,2})/);
  let y = t ? +t[1] : new Date().getFullYear();
  if(t && mo < +t[2] - 6) y += 1;
  return `${y}-${pad(mo)}-${pad(d)}`;
}
function normPhone(p){
  let s = digits(p);
  if(/^9\d{8}$/.test(s)) s = '0' + s;
  if(s.startsWith('886') && s.length === 12) s = '0' + s.slice(3);
  return s;
}
function parseCyber(rows){
  const hi = rows.findIndex(r => (r || []).some(c => String(c).trim() === '商品名稱'));
  if(hi < 0) throw new Error('找不到「商品名稱」欄位，請確認是官網匯出的訂單報表');
  const H = rows[hi].map(c => String(c ?? '').trim());
  const col = n => H.indexOf(n);
  const C = { buyer: col('購買人名稱'), member: col('會員名稱'), phone: col('購買人電話'), item: col('商品名稱'), qty: col('數量'),
              ship: col('運費'), pay: col('付款狀態'), time: col('時間'), no: col('訂單編號'), note: col('備註') };
  const get = (r, k) => C[k] >= 0 ? r[C[k]] : '';
  const orders = []; let cur = null;
  for(const r of rows.slice(hi + 1)){
    if(!r || !r.some(c => String(c ?? '').trim())) continue;
    const no = String(get(r, 'no') || '').trim();
    const item = String(get(r, 'item') || '').trim();
    if(no && (!cur || cur.no !== no)){
      cur = { no, name: String(get(r, 'buyer') || get(r, 'member') || '').trim(), phone: normPhone(get(r, 'phone')),
              time: String(get(r, 'time') || ''), pay: String(get(r, 'pay') || ''), ship: 0, note: '', items: [] };
      orders.push(cur);
    }
    if(!cur) continue;
    cur.ship = Math.max(cur.ship, Number(get(r, 'ship')) || 0);
    const note = String(get(r, 'note') || '').trim();
    if(note && !cur.note.includes(note)) cur.note = cur.note ? cur.note + '；' + note : note;
    if(item) cur.items.push({ raw: item, key: stripPrefix(item), qty: Number(get(r, 'qty')) || 1 });
  }
  return orders.map(o => {
    const dates = [...new Set(o.items.map(i => guessShipDate(i.raw, o.time)).filter(Boolean))];
    const tax = o.note.match(/(?:統編|統一編號)[^\d]{0,4}(\d{8})/) || (/(收據|發票)/.test(o.note) && o.note.match(/(?:^|\D)(\d{8})(?!\d)/));
    const am = /早上|上午|(?:^|\D)(0?[7-9]|1[01])\s*[:：點]/.test(o.note);
    return {
      cyberId: o.no, docId: 'cb-' + (digits(o.no || '') || Math.random().toString(36).slice(2)), name: o.name, phone: o.phone,
      shipDate: dates[0] || '', dateConflict: dates.length > 1,
      method: o.ship > 0 ? 'delivery' : 'pickup',
      paid: /已收到|已付/.test(o.pay), payText: o.pay,
      note: o.note, taxId: tax ? tax[1] : '', am,
      items: o.items, time: o.time
    };
  });
}

/* ============================================================

   ============================================================ */
async function boot(){
  try{
    DB = DEMO ? demoDB() : await firebaseDB();
    await DB.init();
  }catch(e){
    console.error(e);
    $('#app').innerHTML = `<div class="login"><h1>無法連線</h1><p class="sum">請確認網路連線後重新整理。<br><small>${esc(e.code || e.message)}</small></p></div>`;
    return;
  }
  if(!(await DB.isMember())) return renderLogin();
  start();
}

function renderLogin(err = ''){
  $('#app').innerHTML = `<div class="login">
    <h1>半吊子 訂單系統</h1>
    <p class="sum" style="text-align:center">請輸入全店通行碼${DEMO ? '（試用版：0000）' : ''}</p>
    <input id="pass" type="password" inputmode="numeric" autocomplete="off" autofocus>
    ${err ? `<div class="err" style="text-align:center">${esc(err)}</div>` : ''}
    <button class="btn pri block" data-act="login">進入</button></div>`;
  $('#pass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
}
async function doLogin(){
  const code = $('#pass').value.trim();
  if(!code) return;
  $('[data-act=login]').disabled = true;
  const ok = await DB.register(code);
  if(!ok) return renderLogin('通行碼不正確');
  start();
}

function start(){
  const watch = (col, key) => DB.watch(col, (docs, fromCache) => {
    S[key] = docs; S.loaded[key] = true;
    if(key === 'config_list'){
      const main = docs.find(d => d.id === 'main');
      if(main) S.config = main;
      else if(!fromCache && !start._seeding){ start._seeding = true; seed(); }
    }
    indexAll(); render();
  });
  watch('config', 'config_list');
  watch('products', 'products');
  watch('packs', 'packs');
  watch('boxes', 'boxes');
  watch('mappings', 'mappings');
  subscribeOrders();
}
async function seed(){
  const { products, packs, config } = seedData();
  const items = [
    ...products.map(p => ({ col: 'products', id: p.id, data: p })),
    ...packs.map(k => ({ col: 'packs', id: k.id, data: k })),
    { col: 'config', id: 'main', data: config }
  ];
  if(DEMO) items.push(...demoOrders(products));
  await DB.putMany(items);
}
function subscribeOrders(){
  const from = [addDays(today(), -60), S.range.from].sort()[0];
  if(S.windowFrom && from >= S.windowFrom) return;
  S.windowFrom = from;
  S.offOrders?.();
  S.offOrders = DB.watch('orders', docs => { S.orders = docs.filter(d => !d.deleted); S.loaded.orders = true; render(); }, { from });
}

function rangeBar(){
  const t = today(), r = S.range;
  const ws = weekStart(t);
  const q = [
    ['今天', t, t], ['明天', addDays(t, 1), addDays(t, 1)], ['本週', ws, addDays(ws, 6)],

  ];

    <div class="chips">${q.map(([l, f, to]) => `<button class="chip ${r.from === f && r.to === to ? 'on' : ''}" data-act="range" data-f="${f}" data-t="${to}">${l}</button>`).join('')}</div></div>`;
}
const rangeText = () => S.range.from === S.range.to ? fmtDate(S.range.from) : `${fmtDate(S.range.from)} ～ ${fmtDate(S.range.to)}`;

/* ---------- ① 內場 ---------- */
function viewKitchen(){
  const os = todoOrders();
  const agg = aggregate(os);
  const readyN = rangeOrders().filter(o => o.status === 'ready').length;
  if(!agg.length) return `<div class="sum">${rangeText()}</div><div class="empty">這段期間沒有待製作的訂單${readyN ? `<br><small>（另有 ${readyN} 筆已備妥）</small>` : ''}</div>`;
  const series = [...new Set(agg.map(a => a.series))];
  return `<div class="sum">${rangeText()}　待製作 <b>${os.length}</b> 筆，共 <b>${agg.length}</b> 種品項${readyN ? `（已備妥 ${readyN} 筆不計）` : ''}</div>
    ${series.map(s => `<h2 class="sec">${esc(s)}</h2><div class="grid">${agg.filter(a => a.series === s).map(a => `
      <div class="kpi"><div class="name">${esc(a.name)}</div>
        <div class="n">${a.units}<span class="u">${esc(a.unit)}</span></div>
        ${a.batch?.size ? `<div class="sub">→ 需烤 ${Math.ceil(a.units / a.batch.size)} ${esc(a.batch.label)}${a.units % a.batch.size ? `（多 ${a.batch.size - a.units % a.batch.size} ${esc(a.unit)}）` : ''}</div>` : ''}
      </div>`).join('')}</div>`).join('')}`;
}

/* ---------- ② 包裝 ---------- */
function viewPack(){
  const os = todoOrders();
  const agg = aggregate(os);
  if(!agg.length) return `<div class="sum">${rangeText()}</div><div class="empty">這段期間沒有需要準備的包裝</div>`;
  const tot = new Map();
  agg.forEach(a => a.packs.forEach(k => { const key = k.name + '|' + k.size; const t = tot.get(key) || { ...k, count: 0, unit: a.unit }; t.count += k.count; tot.set(key, t); }));
  const totList = [...tot.values()].sort((a, b) => a.order - b.order || b.size - a.size);
  return `<div class="sum">${rangeText()}　待製作 <b>${os.length}</b> 筆</div>
    <div class="card"><div style="font-size:13.5px;color:var(--muted);margin-bottom:6px">包裝總數</div>
      <div class="totals">${totList.map(t => `<span>${esc(packLabel(t.name, t.size, t.unit))} <b>${t.count}</b> 個</span>`).join('')}</div></div>
    ${agg.map(a => {
      const ps = [...a.packs.values()].sort((x, y) => x.order - y.order || y.size - x.size);
      return `<div class="card"><div class="pk-head"><b>${esc(a.name)}</b><span>共 ${a.units} ${esc(a.unit)}</span></div>
        ${ps.map(k => `<div class="pk-row"><span>${esc(packLabel(k.name, k.size, a.unit))}</span><span class="c">× ${k.count}</span></div>`).join('')}</div>`;
    }).join('')}`;
}

/* ---------- ③ 外場 ---------- */
function viewField(){
  const t = today(), tm = addDays(t, 1);
  const live = S.orders.filter(o => o.status !== 'cancel' && o.status !== 'done');
  const amTomorrow = live.filter(o => o.shipDate === tm && o.slot === 'am' && o.method !== 'delivery');
  const unpaidToday = live.filter(o => o.shipDate === t && !o.paid);
  const alerts = [];
  if(amTomorrow.length) alerts.push(`<div class="alert amber"><b>明天早上取貨，今天先打包好</b><ul>${amTomorrow.map(o => `<li>${esc(o.name)}　${fmtPhone(o.phone)}</li>`).join('')}</ul></div>`);
  if(unpaidToday.length) alerts.push(`<div class="alert red"><b>今天交付、尚未付款，記得收款</b><ul>${unpaidToday.map(o => `<li>${esc(o.name)}　${fmtPhone(o.phone)}</li>`).join('')}</ul></div>`);

  const F = { open: ['未完成', o => o.status === 'todo' || o.status === 'ready'], todo: ['待製作', o => o.status === 'todo'],
              ready: ['已備妥', o => o.status === 'ready'], done: ['已完成', o => o.status === 'done'], all: ['全部', o => o.status !== 'cancel'] };
  const list = rangeOrders().filter(F[S.fieldFilter][1]).sort((a, b) => a.shipDate.localeCompare(b.shipDate) || (a.slot === 'am' ? -1 : 0) - (b.slot === 'am' ? -1 : 0) || a.name.localeCompare(b.name));
  const days = [...new Set(list.map(o => o.shipDate))];
  return `${alerts.join('')}
    <div class="chips" style="margin:0 0 6px">${Object.entries(F).map(([k, [l]]) => `<button class="chip ${S.fieldFilter === k ? 'on' : ''}" data-act="ffilter" data-v="${k}">${l}</button>`).join('')}</div>
    ${list.length ? days.map(d => {
      const os = list.filter(o => o.shipDate === d);
      return `<div class="dayh">${fmtDate(d)}<span>${os.length} 筆</span></div>${os.map(o => orderCard(o)).join('')}`;
    }).join('') : `<div class="empty">這段期間沒有訂單</div>`}`;
}

function linesHtml(o){
  return (o.lines || []).map(l => l.kind === 'box'
    ? `<div class="bx">${esc(l.boxName)} × ${l.qty} 盒</div>${(l.items || []).map(it => `<div class="sub">${esc(it.productName)}｜${esc(it.packName)} × ${it.qty}${l.qty > 1 ? `（共 ${it.qty * l.qty}）` : ''}</div>`).join('')}`
    : `<div>${esc(l.productName)}｜${esc(packLabel(l.packName, l.packSize, l.unit))} × ${l.qty}</div>`).join('');
}
function orderCard(o, opts = {}){
  const t = TYPES[o.type] || TYPES.regular;
  const b = [];
  b.push(`<span class="b type">${t.label}</span>`);
  b.push(o.paid ? `<span class="b ok">已付款${o.payMethod ? '・' + esc(o.payMethod) : ''}</span>` : `<span class="b red">未付款</span>`);
  if(o.source) b.push(`<span class="b">${esc(o.source)}</span>`);
  b.push(`<span class="b">${o.method === 'delivery' ? '宅配' : '自取'}</span>`);
  if(o.slot === 'am' && o.method !== 'delivery') b.push(`<span class="b amber">早上取貨</span>`);
  if(o.card?.need) b.push(`<span class="b amber">小卡</span>`);
  if(o.receipt?.need) b.push(`<span class="b amber">收據</span>`);
  if(o.images?.length) b.push(`<span class="b amber">圖片 ${o.images.length}</span>`);
  if(o.posShip) b.push(`<span class="b ok">已送POS${o.posShip.revenue ? ' $' + o.posShip.total.toLocaleString() : '（只扣庫存）'}</span>`);
  if(o.status !== 'todo') b.push(`<span class="b st">${statusText(o)}</span>`);
  const needs = [];
  if(o.card?.need) needs.push(`<div><b>小卡：</b>${esc(o.card.text || '（未填內容）')}</div>`);
  if(o.receipt?.need) needs.push(`<div><b>收據：</b>${o.receipt.taxId ? '統編 ' + esc(o.receipt.taxId) : '不需統編'}</div>`);
  if(o.paid && o.payMethod === '匯款/轉帳') needs.push(`<div><b>匯款：</b>${esc(o.transferDate || '')} 末五碼 ${esc(o.last5 || '')}</div>`);
  if(o.note) needs.push(`<div><b>備註：</b>${esc(o.note)}</div>`);
  const imgs = (o.images || []).map(id => ({ id }));
  const acts = [];
  if(o.status === 'todo') acts.push(`<button class="btn pri sm" data-act="status" data-id="${o.id}" data-v="ready">標記已備妥</button>`);
  if(o.status === 'ready'){
    acts.push(`<button class="btn pri sm" data-act="status" data-id="${o.id}" data-v="done">${o.method === 'delivery' ? '已出貨' : '已取貨'}</button>`);
    acts.push(`<button class="btn sm" data-act="status" data-id="${o.id}" data-v="todo">退回待製作</button>`);
  }
  if(o.status === 'done') acts.push(`<button class="btn sm" data-act="status" data-id="${o.id}" data-v="ready">復原</button>`);
  acts.push(`<button class="btn sm" data-act="edit" data-id="${o.id}">編輯</button>`);
  acts.push(`<button class="btn sm danger" data-act="del-card" data-id="${o.id}" style="margin-left:auto">刪除</button>`);
  return `<div class="oc ${t.cls} st-${o.status}">
    <div class="l1"><span class="nm">${esc(o.name)}</span><a class="ph" href="tel:${esc(o.phone)}">${fmtPhone(o.phone)}</a>
      ${opts.showDate ? `<span class="b">${fmtDate(o.shipDate)}</span>` : ''}</div>
    <div class="badges">${b.join('')}</div>
    <div class="items">${linesHtml(o) || '<span class="sub">（沒有品項）</span>'}</div>
    ${needs.length ? `<div class="need">${needs.join('')}</div>` : ''}

const imgCache = {};
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    for(const [max, q] of [[1600, .78], [1400, .65], [1200, .55], [1000, .5], [800, .45]]){
      const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', q);
      if(data.length < 900000) return data;
    }
    throw new Error('圖片太大');
  }finally{ URL.revokeObjectURL(url); }
}
async function loadImg(id){
  if(imgCache[id]) return imgCache[id];
  imgCache[id] = DB.get('images', id).then(d => d?.data || '').catch(() => '');
  return imgCache[id];
}
function hydrateImages(root = document){
  root.querySelectorAll('img[data-imgid]:not([src])').forEach(async el => {
    const data = await loadImg(el.dataset.imgid);
    if(data){ el.src = data; } else { el.alt = '無法載入'; }
  });
}

async function saveOrder(){
  const d = draft;
  const phone = digits(d.phone);
  const err = !d.name.trim() ? '請填姓名' : !phone ? '請填電話' : !d.shipDate ? '請填出貨日' : !d.source ? '請選訂購來源'

    : d.paid && d.payMethod === '匯款/轉帳' && (!d.transferDate || !/^\d{5}$/.test(d.last5 || '')) ? '匯款請填日期和帳號末五碼（5 碼數字）' : '';
  if(err){ d._err = err; rerenderModal(); return; }
  const lines = d.lines.map(l => l.kind === 'box'
    ? { kind: 'box', boxId: l.boxId, boxName: S.bm[l.boxId]?.name || l.boxName || '', qty: Number(l.qty), items: l._fresh || !l.items ? snapBox(l.boxId) : l.items }
    : { kind: 'item', ...snapItem(l.productId, l.packId, l.qty) });
  const now = Date.now();
  const data = { ...d, phone, name: d.name.trim(), lines, updatedBy: S.me, updatedAt: now };

    }else{

      await DB.add('orders', data);

}

}

  const db = F.getFirestore(initializeApp(POS_CONFIG, 'pos'));
  POS = {
    async products(){ const s = await F.getDoc(F.doc(db, 'pos', 'products')); return s.exists() ? (s.data().items || []) : []; },
    async send(id, data){
      const ref = F.doc(db, 'pos', id);
      if((await F.getDoc(ref)).exists()) throw new Error('這筆已送過 POS');
      await F.setDoc(ref, data);
    }
  };

}
const posMatch = (prods, name) => prods.find(p => p.name === name) || prods.find(p => p.name === name + '雪球') || prods.find(p => p.name.startsWith(name));
/* 訂單中「雪球 × 標準罐」的罐數（禮盒內的標準罐也算） */
function stdJars(o){
  const m = new Map();
  for(const x of expand(o)){
    const p = S.pm[x.productId], k = S.km[x.packId];
    if(!x.count || !k?.useStd || (p?.series || '') !== '雪球') continue;
    const name = p?.name || x.productName;
    m.set(name, (m.get(name) || 0) + x.count);
  }
  return m;
}
let shipDraft = null;
async function proceedDone(o, extra){
  const jars = stdJars(o);
  if(o.posShip || !jars.size) return changeStatus(o.id, 'done', { ...extra, _confirmed: true });

  try{ prods = (await (await posDB()).products()).filter(p => p.active !== false && p.category === 'snowball'); }
  catch(e){ console.error(e); prods = null; }
  shipDraft = { id: o.id, extra, err: prods ? '' : '連不到 POS，可以先不同步直接完成', revenue: !o.cyberId, busy: false,
    rows: (prods || []).map(p => { const n = [...jars.entries()].find(([name]) => posMatch([p], name))?.[1] || 0; return { pid: p.id, name: p.name, price: Number(p.price) || 0, qty: n, on: n > 0 }; }) };
  const unmatched = [...jars.keys()].filter(n => !posMatch(prods || [], n));

          <input type="number" min="0" inputmode="numeric" data-ship="${i}" data-sf="qty" value="${r.qty}" style="width:70px;padding:6px;border:1px solid var(--line);border-radius:8px">

      <label class="chk"><input type="checkbox" data-ship="-1" data-sf="revenue" ${d.revenue ? 'checked' : ''}>記入 POS 營收（金額 $${total.toLocaleString()}）</label>

async function sendShip(){

async function handleImportFile(file){
  try{
    if(!window.XLSX) throw new Error('Excel 元件尚未載入，請重新整理');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: false });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false });
    const parsed = parseCyber(rows);
    if(!parsed.length) throw new Error('檔案中沒有訂單資料');
    const exists = await Promise.all(parsed.map(r => DB.get('orders', r.docId).catch(() => null)));
    parsed.forEach((r, i) => { r.exists = !!exists[i]; r.wasDeleted = !!exists[i]?.deleted; if(r.exists) r.shipDate = exists[i].shipDate; });
    imp.rows = parsed;
    imp.maps = {};
    parsed.flatMap(r => r.items).forEach(i => { const m = S.mappings.find(x => x.key === i.key); if(m) imp.maps[i.key] = m; });
    imp.step = 'preview'; imp.err = '';
  }catch(e){ console.error(e); imp.err = e.message; }
  rerenderModal();
}
async function runImport(){
  const ready = impReady(); if(!ready.length) return;
  imp.busy = true; rerenderModal();
  const now = Date.now();
  const items = [];
  const usedKeys = new Set(ready.flatMap(r => r.items.map(i => i.key)));
  usedKeys.forEach(k => { const m = imp.maps[k]; const old = S.mappings.find(x => x.key === k);
    if(!old || mapVal(old) !== mapVal(m)) items.push({ col: 'mappings', id: old?.id || mapId(k), data: { key: k, ...valToMap(mapVal(m)) } }); });
  for(const r of ready){
    const lines = r.items.map(it => {
      const m = imp.maps[it.key];
      return m.kind === 'box'
        ? { kind: 'box', boxId: m.boxId, boxName: S.bm[m.boxId]?.name || '', qty: it.qty, items: snapBox(m.boxId) }
        : { kind: 'item', ...snapItem(m.productId, m.packId, it.qty) };
    });
    items.push({ col: 'orders', id: r.docId, data: {
      type: 'regular', source: '官網', name: r.name, phone: r.phone, shipDate: r.shipDate, method: r.method, slot: r.am && r.method === 'pickup' ? 'am' : 'pm',
      lines, card: { need: false, text: '' }, receipt: { need: !!r.taxId, taxId: r.taxId || '' },
      paid: r.paid, payMethod: r.paid ? '官網付款' : '', transferDate: '', last5: '', status: 'todo', note: r.note, cyberId: r.cyberId,
      createdBy: S.me, createdAt: now, updatedBy: S.me, updatedAt: now, log: [{ by: S.me, at: now, act: '官網匯入' }] } });
  }
  try{
    await DB.putMany(items);
    const range = ready.map(r => r.shipDate).sort();
    if(range[0] < S.windowFrom){ S.windowFrom = null; subscribeOrders(); }
    closeModal(); toast(`已匯入 ${ready.length} 筆訂單`);
  }catch(e){ imp.busy = false; imp.err = '匯入失敗：' + (e.code || e.message); rerenderModal(); }
}

/* ============================================================
   Export / history
   ============================================================ */
function exportExcel(){
  if(!window.XLSX) return toast('Excel 元件尚未載入');
  const os = rangeOrders().filter(o => o.status !== 'cancel').sort((a, b) => a.shipDate.localeCompare(b.shipDate));
  const lineText = o => (o.lines || []).map(l => l.kind === 'box'
    ? `${l.boxName}×${l.qty}【${(l.items || []).map(i => `${i.productName}${i.packName}×${i.qty}`).join('、')}】`
    : `${l.productName}${l.packName}×${l.qty}`).join('；');
  const rows = os.map(o => ({
    出貨日: o.shipDate, 類型: TYPES[o.type]?.label, 狀態: statusText(o), 姓名: o.name, 電話: o.phone, 來源: o.source,
    取貨方式: o.method === 'delivery' ? '宅配' : '自取', 時段: o.slot === 'am' ? '早上' : '下午', 品項: lineText(o),
    小卡: o.card?.need ? (o.card.text || '需要') : '', 收據統編: o.receipt?.need ? (o.receipt.taxId || '需要') : '',
    付款: o.paid ? '已付款' : '未付款', 付款方式: o.payMethod || '', 匯款日期: o.transferDate || '', 末五碼: o.last5 || '',
    官網編號: o.cyberId || '', 備註: o.note || '', 建立: o.createdBy || '', 最後修改: `${o.updatedBy || ''} ${fmtTime(o.updatedAt)}` }));
  const agg = aggregate(os.filter(o => o.status === 'todo'));
  const k = agg.map(a => ({ 系列: a.series, 品項: a.name, 數量: a.units, 單位: a.unit, 烘烤: a.batch?.size ? `${Math.ceil(a.units / a.batch.size)}${a.batch.label}` : '' }));
  const p = agg.flatMap(a => [...a.packs.values()].map(x => ({ 品項: a.name, 包裝: packLabel(x.name, x.size, a.unit), 個數: x.count })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ 出貨日: '無資料' }]), '訂單');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(k.length ? k : [{ 品項: '無' }]), '內場統計(待製作)');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(p.length ? p : [{ 品項: '無' }]), '包裝統計(待製作)');
  XLSX.writeFile(wb, `半吊子訂單_${S.range.from}_${S.range.to}.xlsx`);
}
async function showHistory(phone){
  const list = (await DB.whereEq('orders', 'phone', phone)).filter(d => !d.deleted).sort((a, b) => b.shipDate.localeCompare(a.shipDate));
  openModal(`歷史訂單 ${fmtPhone(phone)}`, () => list.length ? `<p class="sum">共 ${list.length} 筆</p>` + list.map(o => orderCard(o, { showDate: true })).join('') : '<div class="empty">沒有紀錄</div>');
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  switch(a){
    case 'login': return doLogin();
    case 'pick-me': S.me = v; LS.set('hk-me', v); return render();
    case 'who': S.me = ''; LS.set('hk-me', ''); return render();
    case 'tab': S.tab = v; LS.set('hk-tab', v); window.scrollTo(0, 0); return render();
    case 'range': S.range = { from: el.dataset.f, to: el.dataset.t }; saveRange(); subscribeOrders(); return render();
    case 'ffilter': S.fieldFilter = v; return render();
    case 'past': S.ordersPast = !S.ordersPast; return render();
    case 'new': return openOrderForm(null);
    case 'edit': { const o = S.orders.find(x => x.id === id); if(o) openOrderForm(o); return; }
    case 'status': return changeStatus(id, v);
    case 'import': return openImport();
    case 'export': return exportExcel();
    case 'history': return showHistory(v);
    case 'close': return closeModal();
    case 'set': {
      let val = v; if(el.dataset.path === 'paid') val = v === 'true';
      setPath(draft, el.dataset.path, val);
      if(el.dataset.path === 'paid' && val && !draft.payMethod) draft.payMethod = '';
      return rerenderModal();
    }
    case 'line-add':
      draft.lines.push(v === 'box' ? { kind: 'box', boxId: '', qty: 1, _fresh: true } : { kind: 'item', productId: '', packId: defaultPack(), qty: 1 });
      return rerenderModal();
    case 'line-del': draft.lines.splice(+v, 1); return rerenderModal();
    case 'save-order': return saveOrder();
    case 'ship-go': return sendShip();
    case 'ship-skip': { const d = shipDraft; closeModal(); return changeStatus(d.id, 'done', { ...d.extra, _confirmed: true }); }
    case 'view-img': if(el.src) openViewer(el.src); return;
    case 'viewer-close': $('#viewer').classList.remove('show'); return;
    case 'img-rm': {
      const [kind, key] = v.split(':');
      if(kind === 'old'){ draft.images = draft.images.filter(x => x !== key); (draft._removedImages ||= []).push(key); }
      else draft._newImages.splice(+key, 1);
      return rerenderModal();
    }
    case 'del-order':
      if(!confirmInline(el, '再按一次確認刪除')) return;
      if(await deleteOrder(draft)) closeModal();
      return;
    case 'del-card': {
      if(!confirmInline(el, '再按一次確認刪除')) return;
      const o = S.orders.find(x => x.id === id);
      if(o){ await deleteOrder(o); if(modalRender && $('#modal .oc')) closeModal(); }
      return;
    }
    case 'pay-m': payDraft.method = v; return rerenderModal();
    case 'pay-skip': { const o = S.orders.find(x => x.id === payDraft.id); closeModal(); return o && proceedDone(o, {}); }
    case 'pay-ok': {
      const p = payDraft;
      if(!p.method){ p.err = '請選收款方式'; return rerenderModal(); }
      if(p.method === '匯款/轉帳' && !/^\d{5}$/.test(p.last5)){ p.err = '請填帳號末五碼'; return rerenderModal(); }
      closeModal();
      const o = S.orders.find(x => x.id === p.id);
      return o && proceedDone(o, { paid: true, payMethod: p.method, transferDate: p.method === '匯款/轉帳' ? p.transferDate : '', last5: p.method === '匯款/轉帳' ? p.last5 : '' });
    }
    /* settings */
    case 'staff-add': { const n = $('#newStaff').value.trim(); if(!n || S.config.staff.includes(n)) return; await DB.patch('config', 'main', { staff: [...S.config.staff, n] }); return; }
    case 'staff-del': if(S.config.staff.length <= 1) return toast('至少要保留一位夥伴');
      if(!confirmInline(el, `移除 ${v}？`)) return; await DB.patch('config', 'main', { staff: S.config.staff.filter(x => x !== v) }); return;
    case 'src-add': { const n = $('#newSrc').value.trim(); if(!n || S.config.sources.includes(n)) return; await DB.patch('config', 'main', { sources: [...S.config.sources, n] }); return; }
    case 'src-del': if(!confirmInline(el, `移除 ${v}？`)) return; await DB.patch('config', 'main', { sources: S.config.sources.filter(x => x !== v) }); return;
    case 'pass-set': { const n = $('#newPass').value.trim(); if(n.length < 4) return toast('通行碼至少 4 碼');
      try{ await DB.setPasscode(n); $('#newPass').value = ''; toast('通行碼已更新'); }catch(err){ toast('更新失敗：' + (err.code || err.message)); } return; }
    case 'prod-edit': return openProduct(id);
    case 'prod-save': return saveProduct(id);
    case 'prod-del': if(!confirmInline(el, '確定刪除？')) return; await DB.remove('products', id); closeModal(); return toast('已刪除');
    case 'pack-edit': return openPack(id);
    case 'pack-save': return savePack(id);
    case 'pack-del': if(!confirmInline(el, '確定刪除？')) return; await DB.remove('packs', id); closeModal(); return toast('已刪除');
    case 'box-edit': return openBox(id);
    case 'box-save': return saveBox(id);
    case 'box-del': if(!confirmInline(el, '確定刪除？')) return; await DB.remove('boxes', id); closeModal(); return toast('已刪除');
    case 'bline-add': sdraft.items.push({ productId: '', packId: defaultPack(), qty: 1 }); return rerenderModal();
    case 'bline-del': sdraft.items.splice(+v, 1); return rerenderModal();
    case 'map-edit': return openMapping(id);
    case 'map-save': { if(!sdraft.v) return; const m = S.mappings.find(x => x.id === id); await DB.put('mappings', id, { key: m.key, ...valToMap(sdraft.v) }); closeModal(); return toast('已儲存'); }
    case 'map-del': if(!confirmInline(el, '確定刪除？')) return; await DB.remove('mappings', id); closeModal(); return;
    case 'imp-go': return runImport();
  }
});
async function deleteOrder(d){
  try{
    // 官網訂單留下刪除標記，避免重新匯入時又被加回來
    if(d.cyberId) await DB.put('orders', d.id, { deleted: true, cyberId: d.cyberId, shipDate: d.shipDate, name: d.name, deletedBy: S.me, deletedAt: Date.now() });
    else await DB.remove('orders', d.id);
    for(const id of d.images || []) await DB.remove('images', id).catch(() => {});
    toast('已刪除訂單'); return true;
  }catch(err){ toast('刪除失敗：' + (err.code || err.message)); return false; }
}
/* two-tap confirm without browser dialogs */
function confirmInline(el, msg){
  if(el.dataset.armed === '1') return true;
  el.dataset.armed = '1'; const old = el.textContent; el.textContent = msg; el.classList.add('danger');
  setTimeout(() => { if(el.isConnected){ el.dataset.armed = ''; el.textContent = old; } }, 3000);
  return false;
}

async function onField(e){
  const el = e.target;
  if(el.id === 'rf' || el.id === 'rt'){
    if(e.type !== 'change' || !el.value) return;
    const f = $('#rf').value, t = $('#rt').value;
    S.range = f <= t ? { from: f, to: t } : { from: t, to: f };
    saveRange(); subscribeOrders(); return render();
  }
  if(e.isComposing) return;
  if(el.id === 'oq'){ S.ordersQ = el.value; const pos = el.selectionStart; render(); const n = $('#oq'); n.focus(); n.setSelectionRange(pos, pos); return; }
  if(el.id === 'impFile' && e.type === 'change' && el.files[0]) return handleImportFile(el.files[0]);
  if(el.dataset.imgup != null && draft && e.type === 'change'){
    const files = [...el.files]; if(!files.length) return;
    draft._imgBusy = true; rerenderModal();
    for(const f of files){
      try{ (draft._newImages ||= []).push(await compressImage(f)); }catch(err){ toast('有圖片無法處理：' + err.message); }
    }
    draft._imgBusy = false; rerenderModal(); return;
  }
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if(el.dataset.k && draft){
    setPath(draft, el.dataset.k, val);
    if(el.type === 'checkbox') rerenderModal();
    return;
  }
  if(el.dataset.line != null && draft){
    const l = draft.lines[+el.dataset.line]; const f = el.dataset.lf;
    l[f] = f === 'qty' ? val : val;
    if(f === 'boxId'){ l._fresh = true; }
    if(e.type === 'change' && f !== 'qty') rerenderModal();
    if(f === 'qty' && e.type === 'change') rerenderModal();
    return;
  }
  if(el.dataset.bline != null && sdraft){
    sdraft.items[+el.dataset.bline][el.dataset.lf] = val;
    if(e.type === 'change') rerenderModal();
    return;
  }
  if(el.dataset.sk && sdraft){
    setPath(sdraft, el.dataset.sk, val);
    if(el.type === 'checkbox') rerenderModal();
    return;
  }
  if(el.dataset.pk && payDraft){ payDraft[el.dataset.pk] = val; return; }
  if(el.dataset.ship != null && shipDraft){
    const i = +el.dataset.ship, f = el.dataset.sf;
    if(f === 'revenue') shipDraft.revenue = val;
    else if(f === 'on') shipDraft.rows[i].on = val;
    else { shipDraft.rows[i].qty = Math.max(0, Number(val) || 0); shipDraft.rows[i].on = shipDraft.rows[i].qty > 0; }
    if(e.type === 'change' || el.type === 'checkbox') rerenderModal();
    return;
  }
  if(el.dataset.impmap != null && imp && e.type === 'change'){
    const k = el.dataset.impmap; if(val) imp.maps[k] = { key: k, ...valToMap(val) }; else delete imp.maps[k];
    return rerenderModal();
  }
  if(el.dataset.impdate != null && imp && e.type === 'change'){ imp.rows[+el.dataset.impdate].shipDate = val; imp.rows[+el.dataset.impdate].dateConflict = false; return rerenderModal(); }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('compositionend', e => onField({ target: e.target, type: 'input' }));
document.addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); if(e.target.id === 'viewer') $('#viewer').classList.remove('show'); });
